<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monopolio - Banco Virtual</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- PANTALLA DE INICIO -->
    <div id="setup-screen" class="screen active">
        <div class="setup-container">
            <h1>MONOPOLIO</h1>
            
            <div class="input-group">
                <label for="starting-money">Dinero inicial por jugador:</label>
                <input type="number" id="starting-money" value="1500" min="1">
            </div>

            <div class="players-setup">
                <h2>Jugadores (1 - 8)</h2>
                <div id="players-list">
                    <input type="text" class="player-input" placeholder="Nombre del Jugador 1" required>
                    <input type="text" class="player-input" placeholder="Nombre del Jugador 2" required>
                </div>
                <button id="btn-add-player" class="btn secondary">➕ Añadir Jugador</button>
            </div>

            <button id="btn-start" class="btn primary">Iniciar Partida</button>
        </div>
    </div>

    <!-- PANTALLA DE JUEGO -->
    <div id="game-screen" class="screen">
        <div class="game-layout">
            <!-- Contenedor del tablero con perspectiva 3D -->
            <!-- Contenedor del tablero con perspectiva 3D -->
        <div class="board-container">
            <img src="https://slidechef.net/wp-content/uploads/2023/10/Monopoly-Gameplay-template.jpg" alt="Tablero de Monopolio 3D" class="board-image">
        </div>
            
            <!-- Contenedor de jugadores -->
            <div id="players-grid" class="players-grid">
                <!-- Se inyectan con JS -->
            </div>
        </div>
    </div>

    <!-- MODAL: ACCIONES DEL JUGADOR -->
    <div id="action-modal" class="modal">
        <!-- ... (El resto del modal es igual al anterior) ... -->
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('action-modal')">&times;</span>
            <h2 id="modal-player-name">Nombre</h2>
            
            <div class="action-grid">
                <button class="btn action-btn" onclick="passGo()">Pasó por GO (+$200)</button>
                
                <div class="action-group">
                    <input type="number" id="remove-amount" placeholder="Monto a quitar">
                    <button class="btn action-btn danger" onclick="removeMoney()">Quitar Dinero</button>
                </div>

                <div class="action-group">
                    <input type="number" id="add-amount" placeholder="Monto a agregar">
                    <button class="btn action-btn success" onclick="addMoney()">Agregar Dinero</button>
                </div>

                <div class="action-group">
                    <input type="text" id="property-name" placeholder="Nombre de propiedad">
                    <button class="btn action-btn" onclick="addProperty()">Agregar Propiedad</button>
                </div>

                <button class="btn action-btn primary" onclick="openPropertiesModal()">Lista de Propiedades</button>
            </div>
        </div>
    </div>

    <!-- MODAL: LISTA DE PROPIEDADES -->
    <div id="properties-modal" class="modal">
        <!-- ... (El resto del modal es igual al anterior) ... -->
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('properties-modal')">&times;</span>
            <h2>Propiedades de <span id="prop-player-name"></span></h2>
            <div id="properties-list" class="properties-list">
                <!-- Se inyectan con JS -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
